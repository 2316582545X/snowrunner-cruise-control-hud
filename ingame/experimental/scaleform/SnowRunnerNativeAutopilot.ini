[Autopilot]
; Master switch. 1 = normal cruise HUD: signature scan, observer hooks,
; input thread and HUD row. 0 = fully dormant diagnostic mode (the ASI loads
; but runs no scan, no hooks, no input thread and no HUD row).
Enabled=1
; Cruise toggle: F6=117 keyboard, plus gamepad D-pad left. F2-F12 except F4.
ToggleKey=117
; Gamepad cruise toggle: 1 = D-pad left also toggles, 0 = keyboard only.
GamepadToggle=1
; InputHook=1: background poll thread, low-level keyboard hook, window subclass
; and key/gamepad injection. 0 keeps observer hooks only (throttle hold off).
InputHook=1
; Hooks=1: install MinHook observer patches. 0 rewrites no game function
; prologue (diagnostic; no HUD/input either).
Hooks=1
