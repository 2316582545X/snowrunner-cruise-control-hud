[Autopilot]
Enabled=1
; Windows virtual key: F6=117. F2-F12 supported except F4.
ToggleKey=117
; Gamepad cruise toggle: 1 = D-pad left also toggles, 0 = keyboard only.
GamepadToggle=1
; InputHook=1 enables the background poll thread, low-level keyboard hook,
; window subclass and key/gamepad injection. Set 0 to keep only the HUD
; observer hooks (diagnostic low-footprint mode; cruise throttle hold off).
InputHook=1
